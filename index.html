<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人生感悟随笔</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f7f8fa;
            color: #333;
            line-height: 1.8;
            padding: 20px 15px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .blog-header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e5e7eb;
        }
        .blog-header h1 {
            color: #2d3748;
            font-size: clamp(22px,5vw,28px);
            margin-bottom: 8px;
        }
        .blog-header p {
            color: #718096;
            font-size: clamp(13px,3vw,15px);
        }
        .article-item {
            background: #fff;
            border-radius: 12px;
            padding: clamp(18px,4vw,28px);
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .art-title {
            font-size: clamp(16px,4vw,20px);
            color: #2b6cb0;
            margin-bottom: 10px;
        }
        .art-time {
            font-size: clamp(12px,2.5vw,13px);
            color: #a0aec0;
            margin-bottom: 12px;
        }
        .art-content {
            font-size: clamp(14px,3vw,16px);
            color: #4a5568;
            text-indent: 2em;
            word-break: break-all;
        }
        .admin-bar {
            text-align: center;
            margin-bottom: 25px;
        }
        .btn {
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            margin: 4px;
            font-size: clamp(13px,3vw,14px);
        }
        .btn-primary {
            background: #2b6cb0;
            color: white;
        }
        .btn-danger {
            background: #e53e3e;
            color: white;
        }
        .btn-sm {
            padding: 4px 8px;
            font-size: clamp(12px,2.5vw,13px);
        }
        .login-box {
            max-width: 350px;
            margin: 0 auto;
            background: white;
            padding: 25px 20px;
            border-radius: 12px;
            text-align: center;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        .edit-box {
            background: white;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        .action-btns {
            margin-top: 12px;
            text-align: right;
        }
        footer {
            text-align: center;
            margin-top: 40px;
            color: #a0aec0;
            font-size: clamp(12px,2.5vw,14px);
        }
        /* 手机端按钮适配 */
        @media (max-width: 480px) {
            .action-btns {
                text-align: center;
            }
            .btn {
                width: 30%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="blog-header">
        <h1>个人人生感悟随笔</h1>
        <p>回忆过去成长点滴，不断沉淀思考</p>
    </div>

    <!-- 登录/管理栏 -->
    <div class="admin-bar" id="adminBar"></div>

    <!-- 文章列表 -->
    <div id="articleList"></div>

    <!-- 编辑区域 -->
    <div class="edit-box" id="editBox" style="display: none;">
        <input id="editTitle" placeholder="文章标题">
        <input id="editTime" placeholder="日期 如：2026-05-22">
        <textarea id="editContent" placeholder="文章内容"></textarea>
        <div class="action-btns">
            <button class="btn btn-primary" onclick="saveArticle()">保存文章</button>
            <button class="btn" onclick="cancelEdit()">取消</button>
        </div>
    </div>

    <!-- 页脚 -->
    <footer id="footer"></footer>
</div>

<script>
// 可自行修改登录密码
const PASSWORD = "82704001dd";
let articles = JSON.parse(localStorage.getItem("articles")) || [
    { title: "网页学习开启新旅程", time: "2026-05-22", content: "从零开始学习网页开发技术，循序渐进掌握页面搭建、数据存储与免费部署方法，坚持日常练习，稳步提升自身技能。" },
    { title: "两种网页技术使用心得", time: "2026-05-22", content: "HTML+Vue适合制作美观的展示博客页面，排版自由度高；Python+Streamlit偏向快速开发数据工具，按需选择技术方向，做事效率更高。" }
];
let isLogin = localStorage.getItem("isLogin") === "true";
let editIndex = -1;

// 页面初始化渲染
render();
function render() {
    renderAdminBar();
    renderArticles();
    renderFooter();
}

// 渲染登录管理栏
function renderAdminBar() {
    const bar = document.getElementById("adminBar");
    if (!isLogin) {
        bar.innerHTML = `
            <div class="login-box">
                <h3 style="margin-bottom:15px;font-size:18px;">添加修改删除登录</h3>
                <input type="password" id="pwd" placeholder="输入进入密码">
                <button class="btn btn-primary" onclick="login()">请进入</button>
            </div>
        `;
    } else {
        bar.innerHTML = `
            <button class="btn btn-primary" onclick="addNew()">新增文章</button>
            <button class="btn btn-danger" onclick="logout()">退出登录</button>
        `;
    }
}

// 渲染文章列表
function renderArticles() {
    const list = document.getElementById("articleList");
    let html = "";
    articles.forEach((item, index) => {
        html += `
        <div class="article-item">
            <h2 class="art-title">${item.title}</h2>
            <div class="art-time">${item.time}</div>
            <div class="art-content">${item.content}</div>
            ${isLogin ? `
            <div class="action-btns">
                <button class="btn btn-sm" onclick="editArticle(${index})">修改</button>
                <button class="btn btn-sm btn-danger" onclick="deleteArticle(${index})">删除</button>
            </div>
            ` : ""}
        </div>
        `;
    });
    list.innerHTML = html;
}

// 渲染页脚
function renderFooter() {
    const footer = document.getElementById("footer");
    footer.innerHTML = isLogin 
        ? "✅ 已登录管理模式" 
        : "个人随笔博客 | 游客只读模式";
}

// 登录校验
function login() {
    const pwd = document.getElementById("pwd").value.trim();
    if (pwd === PASSWORD) {
        isLogin = true;
        localStorage.setItem("isLogin", "true");
        render();
    } else {
        alert("密码输入错误，请重新尝试");
    }
}

// 退出登录
function logout() {
    isLogin = false;
    localStorage.removeItem("isLogin");
    render();
}

// 新增文章
function addNew() {
    editIndex = -1;
    document.getElementById("editTitle").value = "";
    document.getElementById("editTime").value = new Date().toLocaleDateString().replaceAll("/", "-");
    document.getElementById("editContent").value = "";
    document.getElementById("editBox").style.display = "block";
}

// 编辑已有文章
function editArticle(index) {
    editIndex = index;
    const item = articles[index];
    document.getElementById("editTitle").value = item.title;
    document.getElementById("editTime").value = item.time;
    document.getElementById("editContent").value = item.content;
    document.getElementById("editBox").style.display = "block";
}

// 保存文章
function saveArticle() {
    const title = document.getElementById("editTitle").value.trim();
    const time = document.getElementById("editTime").value.trim();
    const content = document.getElementById("editContent").value.trim();
    if (!title || !content) {
        alert("标题与文章内容不能为空");
        return;
    }
    const newArticle = { title, time, content };
    if (editIndex === -1) {
        articles.unshift(newArticle);
    } else {
        articles[editIndex] = newArticle;
    }
    localStorage.setItem("articles", JSON.stringify(articles));
    document.getElementById("editBox").style.display = "none";
    render();
}

// 删除文章
function deleteArticle(index) {
    if (!confirm("确定要删除这篇文章吗？")) return;
    articles.splice(index, 1);
    localStorage.setItem("articles", JSON.stringify(articles));
    render();
}

// 取消编辑
function cancelEdit() {
    document.getElementById("editBox").style.display = "none";
}
</script>

</body>
</html>
